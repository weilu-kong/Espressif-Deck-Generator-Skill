# bootstrap revision: 2
name: Bootstrap skill sources

on:
  push:
    paths:
      - 'archives/**'
      - '.github/workflows/bootstrap-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and unpack skill archives
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f v1/SKILL.md && -f v2/SKILL.md ]]; then
            echo "Sources already unpacked."
            exit 0
          fi

          mkdir -p /tmp/skill-archives v1 v2

          cat archives/v1.part*.b64 | base64 -d > /tmp/skill-archives/v1.tar.gz
          cat archives/v2.part*.b64 | base64 -d > /tmp/skill-archives/v2.tar.gz

          tar -xzf /tmp/skill-archives/v1.tar.gz -C v1 --strip-components=1
          tar -xzf /tmp/skill-archives/v2.tar.gz -C v2 --strip-components=1

          rm -rf archives

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "feat: add v1 and v2 skill sources"
          git push
